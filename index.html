<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VWS CAFE | ベクトルカフェ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ヘッダー -->
<header class="header">
  <h1 class="site-title">VWS CAFE</h1>
  <p class="site-catch">コードと珈琲のあるお店</p>
</header>

<!-- メインビジュアル -->
<section class="hero">
  <p class="hero-text">
    今日も一杯、ゆっくりと。
  </p>
</section>

<main class="container">

  <!-- メニュー -->
  <section class="section">
    <h2 class="section-title">Menu</h2>
    <ul class="menu-list">
      <li class="menu-item">
        <span class="menu-name">ブレンドコーヒー</span>
        <span class="menu-price">500円</span>
      </li>
      <li class="menu-item">
        <span class="menu-name">カフェラテ</span>
        <span class="menu-price">550円</span>
      </li>
      <li class="menu-item">
        <span class="menu-name">本日のケーキ</span>
        <span class="menu-price">600円</span>
      </li>
    </ul>
  </section>

  <!-- 営業時間 -->
  <section class="section">
    <h2 class="section-title">営業時間</h2>
    <table class="info-table">
      <tr>
        <th>平日</th>
        <td>9:00 - 18:00</td>
      </tr>
      <tr>
        <th>土日祝</th>
        <td>10:00 - 17:00</td>
      </tr>
      <tr>
        <th>定休日</th>
        <td>水曜日</td>
      </tr>
    </table>
  </section>

  <!-- アクセス -->
  <section class="section">
    <h2 class="section-title">アクセス</h2>
    <p>高知県高知市どこかの町 1-2-3<br>
    最寄り駅から徒歩5分</p>
  </section>

</main>

<!-- フッター -->
<footer class="footer">
  <p>&copy; VWS CAFE</p>
</footer>

</body>
</html>
